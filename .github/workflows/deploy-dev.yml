name: Deploy Dev Branch to VPS

on:
  push:
    branches:
      - Dev

env:
  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Frontend
        working-directory: './auditra web app'
        env:
          VITE_API_URL: '/api'
          VITE_WS_URL: 'ws://auditra.pasidumihiranga.me'
        run: |
          npm ci
          npm run build

      # Fails fast with an actionable message instead of a bare i/o timeout
      # inside the scp action. Compares the secrets against the known-live
      # values and reports only match/mismatch, never the secret itself.
      - name: Preflight SSH reachability check
        run: |
          EXPECTED_IP=159.65.1.78
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"

          # getent hosts does a PTR lookup for numeric addresses and returns
          # nothing when there is no reverse record, so use ahostsv4, which
          # handles bare IPs and hostnames alike.
          RESOLVED=$(getent ahostsv4 "$VPS_HOST" 2>/dev/null | awk '{print $1}' | head -1)
          if [ -z "$RESOLVED" ]; then
            echo "::error::VPS_HOST does not resolve to any address."
            exit 1
          fi
          if [ "$RESOLVED" = "$EXPECTED_IP" ]; then
            echo "VPS_HOST resolves to the expected live droplet IP."
          else
            echo "::error::VPS_HOST resolves to an address that is NOT the live droplet."
            echo "Expected the droplet at $EXPECTED_IP. Update the VPS_HOST secret."
            exit 1
          fi

          if [ "$VPS_USERNAME" = "root" ]; then
            echo "VPS_USERNAME is root (matches the account whose key is authorized)."
          else
            echo "::warning::VPS_USERNAME is NOT root. Confirm that account has the deploy key in its authorized_keys."
          fi

          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$VPS_HOST/$VPS_SSH_PORT" 2>/dev/null; then
            echo "TCP connect to port $VPS_SSH_PORT succeeded."
          else
            echo "::error::Host resolves correctly but port $VPS_SSH_PORT is unreachable from this runner."
            echo "The droplet firewall (ufw) is open, so check for a DigitalOcean Cloud Firewall"
            echo "under Networking -> Firewalls. It filters upstream and is invisible from inside the VM."
            exit 1
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          source: "backend/,auditra web app/dist/"
          target: "/var/www/auditra"
          strip_components: 0

      - name: Execute post-deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_SSH_PORT }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/auditra/backend

            # Activate virtual environment and install dependencies
            # Adjust path if your venv is located elsewhere on the VPS
            if [ -d "venv" ]; then
              source venv/bin/activate
            else
              python3 -m venv venv
              source venv/bin/activate
            fi

            pip install -r requirements.txt

            # Run database migrations
            python manage.py migrate

            # Restart backend services (Systemd)
            sudo systemctl restart auditra-daphne
            sudo systemctl restart auditra-celery
            sudo systemctl restart auditra-celerybeat

            # Restart Nginx for frontend/API routing changes
            sudo systemctl restart nginx
